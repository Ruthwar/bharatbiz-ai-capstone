name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: none
      BHARATBIZ_LEDGER_DB: ":memory:"
      BHARATBIZ_RAG_DB: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Evaluate all scenarios
        run: python scripts/evaluate_scenarios.py
      - name: Compare deterministic ranking with OR-Tools
        run: python scripts/compare_planners.py
